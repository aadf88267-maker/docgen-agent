<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>search x</title>
<style>
  :root {
    --bg: #1a1a1a;
    --bg-2: #1f1f1f;
    --bg-3: #252525;
    --bg-4: #2b2b2b;
    --border: #2e2e2e;
    --border-light: #383838;
    --text: #e8e6e3;
    --text-dim: #8a8a8a;
    --text-dimmer: #5c5c5c;
    --accent: #d97757;
    --accent-dim: #a05a42;
    --green: #7fb069;
    --yellow: #d4a259;
    --red: #c75450;
    --blue: #6a9fbf;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOP BAR */
  .topbar {
    height: 44px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: -0.2px; }
  .topbar-spacer { flex: 1; }
  .topbar-btn {
    background: var(--bg-3);
    border: 1px solid var(--border-light);
    color: var(--text-dim);
    padding: 5px 10px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11.5px;
    cursor: pointer;
  }
  .topbar-btn:hover { background: var(--border); color: var(--text); }
  .topbar-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .topbar-btn.primary:hover { background: var(--accent-dim); }

  /* LAYOUT */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 260px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-section {
    padding: 10px 12px 6px;
    font-size: 10.5px;
    color: var(--text-dimmer);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .chat-item {
    padding: 8px 12px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 2px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item:hover { background: var(--bg-3); color: var(--text); }
  .chat-item.active { background: var(--bg-3); color: var(--text); border-left-color: var(--accent); }
  .chat-item.pinned {
    background: rgba(217, 119, 87, 0.06);
    color: var(--text);
    font-weight: 600;
    border-left-color: var(--accent);
  }
  .chat-item.pinned:hover { background: rgba(217, 119, 87, 0.12); }
  .chat-item .icon { flex-shrink: 0; font-size: 12px; }
  .chat-item .label { overflow: hidden; text-overflow: ellipsis; }
  .chat-item .count {
    margin-left: auto;
    font-size: 10.5px;
    color: var(--text-dimmer);
    background: var(--bg-3);
    padding: 1px 6px;
    border-radius: 8px;
  }
  .chat-item.pinned .count { background: rgba(217, 119, 87, 0.15); color: var(--accent); }

  .sidebar-divider {
    height: 1px;
    background: var(--border);
    margin: 8px 12px;
  }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 12px;
  }
  .sidebar-empty {
    padding: 20px 14px;
    color: var(--text-dimmer);
    font-size: 11.5px;
    text-align: center;
  }

  /* MAIN */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .main-header {
    height: 44px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
  }
  .main-title {
    font-weight: 600;
    color: var(--text);
    font-size: 13.5px;
    letter-spacing: -0.2px;
  }
  .badge {
    background: var(--bg-3);
    color: var(--text-dim);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10.5px;
  }
  .badge.pin-badge {
    background: rgba(217, 119, 87, 0.15);
    color: var(--accent);
    border: 1px solid rgba(217, 119, 87, 0.3);
  }

  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px 60px;
  }

  /* SEARCH X TABLE */
  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .table th {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-light);
    color: var(--text-dimmer);
    font-weight: 500;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
  }
  .table tr:hover td { background: var(--bg-2); cursor: pointer; }
  .table tr:hover td:first-child { color: var(--accent); }
  .table .date { color: var(--text); font-weight: 500; white-space: nowrap; }
  .table .summary { color: var(--text-dim); }
  .table .summary.quiet { color: var(--text-dimmer); font-style: italic; }
  .table .num { text-align: right; color: var(--text-dimmer); white-space: nowrap; }

  /* DAY CHAT */
  .worklog-toggle {
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    padding: 8px 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .worklog-toggle:hover { color: var(--accent); }
  .worklog-toggle .arrow {
    display: inline-block;
    transition: transform 0.15s ease;
    font-size: 10px;
    color: var(--text-dimmer);
  }
  .worklog-toggle.open .arrow { transform: rotate(90deg); }

  .worklog-body {
    display: none;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 12px 14px;
    margin: 6px 0 20px;
    font-size: 11.5px;
    color: var(--text-dim);
    max-height: 420px;
    overflow-y: auto;
  }
  .worklog-body.open { display: block; }
  .worklog-line {
    padding: 2px 0;
    display: flex;
    gap: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .worklog-line .kind {
    flex-shrink: 0;
    width: 55px;
    font-size: 10.5px;
    letter-spacing: 0.3px;
  }
  .worklog-line .kind.search { color: var(--blue); }
  .worklog-line .kind.llm { color: var(--accent); }
  .worklog-line .kind.info { color: var(--yellow); }
  .worklog-line .body { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; }
  .worklog-line .status-ok { color: var(--green); }
  .worklog-line .status-bad { color: var(--red); }

  .section-label {
    font-size: 10.5px;
    color: var(--text-dimmer);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 22px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .finding {
    padding: 12px 14px;
    background: var(--bg-2);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .finding.change { border-left-color: var(--yellow); }
  .finding.new { border-left-color: var(--green); }
  .finding .icon { flex-shrink: 0; font-size: 13px; line-height: 1.5; }
  .finding .content { flex: 1; }
  .finding .app { color: var(--text); font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
  .finding .summary { color: var(--text-dim); font-size: 12px; }
  .finding .meta { color: var(--text-dimmer); font-size: 10.5px; margin-top: 4px; }
  .finding a { color: var(--blue); text-decoration: none; }
  .finding a:hover { text-decoration: underline; }

  .no-findings {
    color: var(--text-dimmer);
    font-size: 12.5px;
    font-style: italic;
    padding: 20px 0;
  }

  .empty {
    text-align: center;
    padding: 100px 20px;
    color: var(--text-dimmer);
    font-size: 12.5px;
    line-height: 1.8;
  }
  .empty code {
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--accent);
  }

  /* SETTINGS BAR */
  .settings-bar {
    display: none;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .settings-bar.open { display: flex; }
  .settings-bar input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11.5px;
    outline: none;
  }
  .settings-bar input:focus { border-color: var(--accent-dim); }

  /* STATUS BAR */
  .statusbar {
    height: 26px;
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 14px;
    font-size: 11px;
    color: var(--text-dimmer);
    flex-shrink: 0;
  }
  .statusbar .ok { color: var(--green); }
  .statusbar .err { color: var(--red); }
  .statusbar .busy { color: var(--yellow); }
  .statusbar-spacer { flex: 1; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg-2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <span class="logo">docgen-agent</span>
  <div class="topbar-spacer"></div>
  <button class="topbar-btn" id="settingsBtn">settings</button>
  <button class="topbar-btn" id="refreshBtn">↻ refresh</button>
  <button class="topbar-btn primary" id="runBtn">▶ run now</button>
</div>

<!-- SETTINGS BAR -->
<div class="settings-bar" id="settingsBar">
  <input id="repoInput" placeholder="owner/repo" style="width: 240px;" />
  <input id="tokenInput" type="password" placeholder="gh token (run now)" style="width: 220px;" />
  <button class="topbar-btn" id="saveSettings">save</button>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div id="pinnedArea"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">chats</div>
    <div class="sidebar-list" id="chatList">
      <div class="sidebar-empty">loading…</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="main-header" id="mainHeader">
      <span class="main-title">search x</span>
      <span class="badge pin-badge">pinned</span>
    </div>
    <div class="main-content" id="mainContent">
      <div class="empty">
        loading…
      </div>
    </div>
  </div>

</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <span class="status-msg" id="statusMsg">ready</span>
  <div class="statusbar-spacer"></div>
  <span id="lastRun">—</span>
</div>

<script>
const $ = (id) => document.getElementById(id);
const config = {
  repo: localStorage.getItem("repo") || "",
  token: localStorage.getItem("token") || "",
};

let LOG = { chat: "search x", pinned: true, days: [] };
let view = { type: "pinned" }; // or { type: "day", date: "..." }

$("repoInput").value = config.repo;
$("tokenInput").value = config.token;

function setStatus(msg, cls) {
  const el = $("statusMsg");
  el.textContent = msg;
  el.className = "status-msg" + (cls ? " " + cls : "");
}

// ---- SETTINGS ----
$("settingsBtn").onclick = () => $("settingsBar").classList.toggle("open");
$("saveSettings").onclick = () => {
  config.repo = $("repoInput").value.trim();
  config.token = $("tokenInput").value.trim();
  localStorage.setItem("repo", config.repo);
  localStorage.setItem("token", config.token);
  $("settingsBar").classList.remove("open");
  setStatus("saved", "ok");
  load();
};

// ---- LOAD ----
async function load() {
  if (!config.repo) {
    render();
    setStatus("set repo in settings", "err");
    return;
  }
  setStatus("loading…", "busy");
  try {
    const url = `https://raw.githubusercontent.com/${config.repo}/main/log.json?t=${Date.now()}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    LOG = await r.json();
    render();
    setStatus("loaded", "ok");
    const latest = LOG.days?.[0];
    $("lastRun").textContent = latest?.finished_at
      ? "last run " + new Date(latest.finished_at).toLocaleString()
      : "no runs yet";
  } catch (e) {
    setStatus(`load failed: ${e.message}`, "err");
    render();
  }
}
$("refreshBtn").onclick = load;

// ---- RENDER ----
function render() {
  const days = LOG.days || [];

  // pinned chat item
  $("pinnedArea").innerHTML = `
    <div class="chat-item pinned ${view.type === "pinned" ? "active" : ""}" id="pinnedChat">
      <span class="icon">📌</span>
      <span class="label">search x</span>
      <span class="count">${days.length}</span>
    </div>
  `;
  setTimeout(() => {
    const el = $("pinnedChat");
    if (el) el.onclick = () => { view = { type: "pinned" }; render(); };
  }, 0);

  // chat list
  const list = $("chatList");
  if (!days.length) {
    list.innerHTML = '<div class="sidebar-empty">no chats yet</div>';
  } else {
    list.innerHTML = "";
    days.forEach(d => {
      const findings = d.findings || [];
      const cls = view.type === "day" && view.date === d.date ? "active" : "";
      const item = document.createElement("div");
      item.className = "chat-item " + cls;
      item.innerHTML = `
        <span class="icon">💬</span>
        <span class="label">${esc(formatDate(d.date))}</span>
        <span class="count">${findings.length}</span>
      `;
      item.onclick = () => { view = { type: "day", date: d.date }; render(); };
      list.appendChild(item);
    });
  }

  // main header + content
  if (view.type === "pinned") {
    $("mainHeader").innerHTML = `
      <span class="main-title">search x</span>
      <span class="badge pin-badge">pinned</span>
      <span class="badge">${days.length} days</span>
    `;
    renderSearchX(days);
  } else {
    const day = days.find(d => d.date === view.date);
    if (!day) { view = { type: "pinned" }; render(); return; }
    $("mainHeader").innerHTML = `
      <span class="main-title">${esc(formatDate(day.date))}</span>
      <span class="badge">${(day.findings || []).length} findings</span>
    `;
    renderDay(day);
  }
}

function renderSearchX(days) {
  if (!days.length) {
    $("mainContent").innerHTML = `
      <div class="empty">
        no chats yet<br><br>
        the agent will create one chat per day,<br>
        even on quiet days
      </div>`;
    return;
  }

  const rows = days.map(d => {
    const findings = d.findings || [];
    const hasFindings = findings.length > 0;
    const summary = hasFindings
      ? summarizeFindings(findings)
      : `<span class="quiet">— no main findings —</span>`;
    const cls = hasFindings ? "" : "quiet";
    return `
      <tr data-date="${esc(d.date)}">
        <td class="date">${esc(formatDate(d.date))}</td>
        <td class="summary ${cls}">${summary}</td>
        <td class="num">${d.searches || 0}</td>
      </tr>
    `;
  }).join("");

  $("mainContent").innerHTML = `
    <table class="table">
      <thead>
        <tr>
          <th>date</th>
          <th>main findings</th>
          <th class="num">searches</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  document.querySelectorAll("tr[data-date]").forEach(tr => {
    tr.onclick = () => { view = { type: "day", date: tr.getAttribute("data-date") }; render(); };
  });
}

function summarizeFindings(findings) {
  const changes = findings.filter(f => f.type === "change").length;
  const news = findings.filter(f => f.type === "new").length;
  const parts = [];
  if (changes) parts.push(`${changes} change${changes > 1 ? "s" : ""}`);
  if (news) parts.push(`${news} new app${news > 1 ? "s" : ""}`);
  return esc(parts.join(", "));
}

function renderDay(day) {
  const wl = day.work_log || [];
  const searches = wl.filter(x => x.kind === "search").length;
  const llms = wl.filter(x => x.kind === "llm").length;
  const findings = day.findings || [];

  const findingsHtml = findings.length
    ? findings.map(renderFinding).join("")
    : '<div class="no-findings">no main findings</div>';

  $("mainContent").innerHTML = `
    <div class="worklog-toggle" id="wlToggle">
      <span class="arrow">▶</span>
      work log · ${searches} searches · ${llms} llm calls
    </div>
    <div class="worklog-body" id="wlBody">
      ${wl.map(renderLogLine).join("") || '<div style="color: var(--text-dimmer);">no log entries</div>'}
    </div>

    <div class="section-label">main findings</div>
    <div class="findings">${findingsHtml}</div>
  `;

  const toggle = $("wlToggle");
  const body = $("wlBody");
  toggle.onclick = () => {
    toggle.classList.toggle("open");
    body.classList.toggle("open");
  };
}

function renderLogLine(l) {
  if (l.kind === "search") {
    const status = l.error
      ? `<span class="status-bad">✗ ${esc(l.error)}</span>`
      : `<span class="status-ok">${l.hits} hits</span>`;
    return `<div class="worklog-line"><span class="kind search">search</span><span class="body">${esc(l.provider || "?")} · ${esc(l.query || "")} · ${status}</span></div>`;
  }
  if (l.kind === "llm") {
    const status = l.status === "ok"
      ? `<span class="status-ok">ok</span>`
      : `<span class="status-bad">${esc(l.status || "fail")}${l.error ? " · " + esc(l.error) : ""}</span>`;
    return `<div class="worklog-line"><span class="kind llm">llm</span><span class="body">${esc(l.app || "?")} · ${esc(l.model || "?")} · ${status}</span></div>`;
  }
  if (l.kind === "info") {
    return `<div class="worklog-line"><span class="kind info">info</span><span class="body">${esc(l.message || "")}</span></div>`;
  }
  return "";
}

function renderFinding(f) {
  const icon = f.type === "new" ? "🆕" : "🔄";
  const cls = f.type === "new" ? "new" : "change";
  const meta = f.extracted_by ? `via ${f.extracted_by}` : "";
  return `
    <div class="finding ${cls}">
      <div class="icon">${icon}</div>
      <div class="content">
        <div class="app">${esc(f.app || "?")}</div>
        <div class="summary">${esc(f.summary || "")}</div>
        ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
      </div>
    </div>
  `;
}

function formatDate(iso) {
  if (!iso) return "unknown";
  try {
    const d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  } catch { return iso; }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---- RUN NOW ----
$("runBtn").onclick = async () => {
  if (!config.repo || !config.token) { setStatus("need repo + token", "err"); return; }
  setStatus("triggering…", "busy");
  try {
    const [owner, repo] = config.repo.split("/");
    const res = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/actions/workflows/agent.yml/dispatches`,
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${config.token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ ref: "main" }),
      }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setStatus("triggered · refresh in ~90s", "ok");
    setTimeout(load, 90000);
  } catch (e) {
    setStatus(`run failed: ${e.message}`, "err");
  }
};

load();
</script>
</body>
</html>
