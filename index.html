<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>search x</title>
<style>
  :root {
    --bg: #1a1a1a;
    --bg-2: #1f1f1f;
    --bg-3: #252525;
    --bg-4: #2b2b2b;
    --border: #2e2e2e;
    --border-light: #383838;
    --text: #e8e6e3;
    --text-dim: #8a8a8a;
    --text-dimmer: #5c5c5c;
    --accent: #d97757;
    --accent-dim: #a05a42;
    --green: #7fb069;
    --yellow: #d4a259;
    --red: #c75450;
    --blue: #6a9fbf;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    height: 44px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: -0.2px; }
  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dimmer);
    margin-left: 10px;
    transition: background 0.2s;
  }
  .live-dot.on {
    background: var(--green);
    box-shadow: 0 0 8px rgba(127, 176, 105, 0.6);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .live-label {
    color: var(--text-dimmer);
    font-size: 10.5px;
    margin-left: 6px;
  }
  .live-label.on { color: var(--green); }

  .topbar-spacer { flex: 1; }
  .topbar-btn {
    background: var(--bg-3);
    border: 1px solid var(--border-light);
    color: var(--text-dim);
    padding: 5px 10px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11.5px;
    cursor: pointer;
  }
  .topbar-btn:hover { background: var(--border); color: var(--text); }
  .topbar-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .topbar-btn.primary:hover { background: var(--accent-dim); }

  .layout { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 260px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-section {
    padding: 10px 12px 6px;
    font-size: 10.5px;
    color: var(--text-dimmer);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .chat-item {
    padding: 8px 12px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 2px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item:hover { background: var(--bg-3); color: var(--text); }
  .chat-item.active { background: var(--bg-3); color: var(--text); border-left-color: var(--accent); }
  .chat-item.pinned {
    background: rgba(217, 119, 87, 0.06);
    color: var(--text);
    font-weight: 600;
    border-left-color: var(--accent);
  }
  .chat-item.pinned:hover { background: rgba(217, 119, 87, 0.12); }
  .chat-item.live {
    background: rgba(127, 176, 105, 0.06);
    border-left-color: var(--green);
  }
  .chat-item .icon { flex-shrink: 0; font-size: 12px; }
  .chat-item .label { overflow: hidden; text-overflow: ellipsis; }
  .chat-item .count {
    margin-left: auto;
    font-size: 10.5px;
    color: var(--text-dimmer);
    background: var(--bg-3);
    padding: 1px 6px;
    border-radius: 8px;
  }
  .chat-item.pinned .count { background: rgba(217, 119, 87, 0.15); color: var(--accent); }
  .chat-item.live .count { background: rgba(127, 176, 105, 0.15); color: var(--green); }

  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 12px; }
  .sidebar-list { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .sidebar-empty { padding: 20px 14px; color: var(--text-dimmer); font-size: 11.5px; text-align: center; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-header {
    height: 44px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
  }
  .main-title { font-weight: 600; color: var(--text); font-size: 13.5px; letter-spacing: -0.2px; }
  .badge {
    background: var(--bg-3);
    color: var(--text-dim);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10.5px;
  }
  .badge.pin-badge {
    background: rgba(217, 119, 87, 0.15);
    color: var(--accent);
    border: 1px solid rgba(217, 119, 87, 0.3);
  }
  .badge.live-badge {
    background: rgba(127, 176, 105, 0.15);
    color: var(--green);
    border: 1px solid rgba(127, 176, 105, 0.3);
  }

  .main-content { flex: 1; overflow-y: auto; padding: 24px 28px 60px; }

  .table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .table th {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-light);
    color: var(--text-dimmer);
    font-weight: 500;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); }
  .table tr:hover td { background: var(--bg-2); cursor: pointer; }
  .table tr:hover td:first-child { color: var(--accent); }
  .table .date { color: var(--text); font-weight: 500; white-space: nowrap; }
  .table .summary { color: var(--text-dim); }
  .table .summary.quiet { color: var(--text-dimmer); font-style: italic; }
  .table .summary.live { color: var(--green); }
  .table .num { text-align: right; color: var(--text-dimmer); white-space: nowrap; }

  .worklog-toggle {
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    padding: 8px 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .worklog-toggle:hover { color: var(--accent); }
  .worklog-toggle.live { color: var(--green); }
  .worklog-toggle .arrow {
    display: inline-block;
    transition: transform 0.15s ease;
    font-size: 10px;
    color: var(--text-dimmer);
  }
  .worklog-toggle.open .arrow { transform: rotate(90deg); }
  .worklog-body {
    display: none;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 12px 14px;
    margin: 6px 0 20px;
    font-size: 11.5px;
    color: var(--text-dim);
    max-height: 420px;
    overflow-y: auto;
  }
  .worklog-body.open { display: block; }
  .worklog-line {
    padding: 2px 0;
    display: flex;
    gap: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .worklog-line .kind {
    flex-shrink: 0;
    width: 55px;
    font-size: 10.5px;
    letter-spacing: 0.3px;
  }
  .worklog-line .kind.search { color: var(--blue); }
  .worklog-line .kind.llm { color: var(--accent); }
  .worklog-line .kind.info { color: var(--yellow); }
  .worklog-line .body { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; }
  .worklog-line .status-ok { color: var(--green); }
  .worklog-line .status-bad { color: var(--red); }

  .section-label {
    font-size: 10.5px;
    color: var(--text-dimmer);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 22px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .finding {
    padding: 12px 14px;
    background: var(--bg-2);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    transition: background 0.1s ease;
  }
  .finding:hover { background: var(--bg-3); }
  .finding.change { border-left-color: var(--yellow); }
  .finding.new { border-left-color: var(--green); }
  .finding.app { border-left-color: var(--blue); }
  .finding.expanded { background: var(--bg-3); }
  .finding .icon { flex-shrink: 0; font-size: 13px; line-height: 1.5; }
  .finding .content { flex: 1; min-width: 0; }
  .finding .app { color: var(--text); font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
  .finding .summary { color: var(--text-dim); font-size: 12px; }
  .finding .meta { color: var(--text-dimmer); font-size: 10.5px; margin-top: 4px; }
  .finding .expand-hint { color: var(--text-dimmer); font-size: 10.5px; margin-top: 6px; }
  .finding.expanded .expand-hint { color: var(--accent); }

  .finding-details {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-light);
    font-size: 12px;
    cursor: default;
  }
  .finding-details .grid {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 6px 14px;
  }
  .finding-details .key {
    color: var(--text-dimmer);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding-top: 3px;
  }
  .finding-details .val { color: var(--text); word-break: break-word; }
  .finding-details .val a { color: var(--blue); text-decoration: none; }
  .finding-details .val a:hover { text-decoration: underline; }
  .finding-details .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .finding-details .tag {
    background: var(--bg);
    border: 1px solid var(--border-light);
    color: var(--text-dim);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
  }
  .finding-details .badge-green {
    background: rgba(127, 176, 105, 0.15);
    color: var(--green);
    border: 1px solid rgba(127, 176, 105, 0.3);
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 11px;
  }
  .finding-details .badge-red {
    background: rgba(199, 84, 80, 0.15);
    color: var(--red);
    border: 1px solid rgba(199, 84, 80, 0.3);
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 11px;
  }
  .finding-details .section {
    margin-top: 14px;
    font-size: 10.5px;
    color: var(--text-dimmer);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .no-findings { color: var(--text-dimmer); font-size: 12.5px; font-style: italic; padding: 6px 0 14px; }

  .empty {
    text-align: center;
    padding: 100px 20px;
    color: var(--text-dimmer);
    font-size: 12.5px;
    line-height: 1.8;
  }
  .empty code {
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--accent);
  }

  .settings-bar {
    display: none;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .settings-bar.open { display: flex; }
  .settings-bar input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11.5px;
    outline: none;
  }
  .settings-bar input:focus { border-color: var(--accent-dim); }

  .statusbar {
    height: 26px;
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 14px;
    font-size: 11px;
    color: var(--text-dimmer);
    flex-shrink: 0;
  }
  .statusbar .ok { color: var(--green); }
  .statusbar .err { color: var(--red); }
  .statusbar .busy { color: var(--yellow); }
  .statusbar-spacer { flex: 1; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg-2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">docgen-agent</span>
  <span class="live-dot" id="liveDot"></span>
  <span class="live-label" id="liveLabel">offline</span>
  <div class="topbar-spacer"></div>
  <button class="topbar-btn" id="settingsBtn">settings</button>
  <button class="topbar-btn" id="refreshBtn">↻ refresh</button>
  <button class="topbar-btn primary" id="runBtn">▶ run now</button>
</div>

<div class="settings-bar" id="settingsBar">
  <input id="repoInput" placeholder="owner/repo" style="width: 240px;" />
  <input id="tokenInput" type="password" placeholder="gh token (run now)" style="width: 220px;" />
  <button class="topbar-btn" id="saveSettings">save</button>
</div>

<div class="layout">
  <div class="sidebar">
    <div id="pinnedArea"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">chats</div>
    <div class="sidebar-list" id="chatList">
      <div class="sidebar-empty">loading…</div>
    </div>
  </div>

  <div class="main">
    <div class="main-header" id="mainHeader">
      <span class="main-title">search x</span>
      <span class="badge pin-badge">pinned</span>
    </div>
    <div class="main-content" id="mainContent">
      <div class="empty">loading…</div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span class="status-msg" id="statusMsg">ready</span>
  <div class="statusbar-spacer"></div>
  <span id="lastRun">—</span>
</div>

<script>
const $ = (id) => document.getElementById(id);
const config = {
  repo: localStorage.getItem("repo") || "",
  token: localStorage.getItem("token") || "",
};

const NTFY_TOPIC = "docgen-live-aadf88267";

let LOG = { chat: "search x", pinned: true, days: [] };
let view = { type: "pinned" };
let liveDay = null;
let liveES = null;

$("repoInput").value = config.repo;
$("tokenInput").value = config.token;

function setStatus(msg, cls) {
  const el = $("statusMsg");
  el.textContent = msg;
  el.className = "status-msg" + (cls ? " " + cls : "");
}

function setLive(on) {
  $("liveDot").classList.toggle("on", on);
  $("liveLabel").classList.toggle("on", on);
  $("liveLabel").textContent = on ? "live" : "offline";
}

$("settingsBtn").onclick = () => $("settingsBar").classList.toggle("open");
$("saveSettings").onclick = () => {
  config.repo = $("repoInput").value.trim();
  config.token = $("tokenInput").value.trim();
  localStorage.setItem("repo", config.repo);
  localStorage.setItem("token", config.token);
  $("settingsBar").classList.remove("open");
  setStatus("saved", "ok");
  load();
};

async function load() {
  if (!config.repo) { render(); setStatus("set repo in settings", "err"); return; }
  setStatus("loading…", "busy");
  try {
    const url = `https://raw.githubusercontent.com/${config.repo}/main/log.json?t=${Date.now()}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    LOG = await r.json();
    render();
    setStatus("loaded", "ok");
    const latest = LOG.days?.[0];
    $("lastRun").textContent = latest?.finished_at
      ? "last run " + new Date(latest.finished_at).toLocaleString()
      : "no runs yet";
  } catch (e) {
    setStatus(`load failed: ${e.message}`, "err");
    render();
  }
}
$("refreshBtn").onclick = load;

// ============================================================
// LIVE STREAM
// ============================================================

function startLiveStream() {
  if (liveES) return;
  try {
    liveES = new EventSource(`https://ntfy.sh/${NTFY_TOPIC}/sse`);
    liveES.onerror = () => setLive(false);
    liveES.onmessage = (e) => {
      try {
        const wrap = JSON.parse(e.data);
        if (wrap.event !== "message") return;
        const evt = JSON.parse(wrap.message);
        handleLiveEvent(evt, wrap.time ? wrap.time * 1000 : Date.now());
      } catch {}
    };
  } catch (err) {
    console.error("live stream failed", err);
  }
}

function ensureLiveDay(ts) {
  if (liveDay) return;
  const date = new Date(ts).toISOString().slice(0, 10);
  liveDay = {
    date: date,
    live: true,
    started_at: new Date(ts).toISOString(),
    finished_at: null,
    searches: 0,
    llm_calls: 0,
    work_log: [],
    findings: [],
    apps: [],
  };
  setLive(true);
}

function handleLiveEvent(evt, ts) {
  const kind = evt.kind;

  if (kind === "start") {
    const date = evt.date || new Date(ts).toISOString().slice(0, 10);
    liveDay = {
      date: date,
      live: true,
      started_at: new Date(ts).toISOString(),
      finished_at: null,
      searches: 0,
      llm_calls: 0,
      work_log: [],
      findings: [],
      apps: [],
    };
    setLive(true);
    view = { type: "day", date: date };
    render();
    return;
  }

  ensureLiveDay(ts);

  if (kind === "end") {
    if (liveDay) {
      liveDay.live = false;
      liveDay.finished_at = new Date(ts).toISOString();
    }
    setLive(false);
    render();
    setTimeout(load, 25000);
    return;
  }

  liveDay.work_log.push({ kind: kind, ...evt, _ts: ts });
  if (kind === "search") liveDay.searches++;
  if (kind === "llm") liveDay.llm_calls++;

  if (view.type !== "day" || view.date !== liveDay.date) {
    view = { type: "day", date: liveDay.date };
    render();
  } else {
    appendLiveLine(kind, evt);
  }
}

function appendLiveLine(kind, evt) {
  const body = $("wlBody");
  if (!body) { render(); return; }
  body.classList.add("open");
  const toggle = $("wlToggle");
  if (toggle) toggle.classList.add("open");

  const div = document.createElement("div");
  div.className = "worklog-line";
  div.innerHTML = renderLogLine({ kind: kind, ...evt });
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;

  if (toggle && liveDay) {
    toggle.innerHTML = `<span class="arrow">▼</span> live · ${liveDay.searches} searches · ${liveDay.llm_calls} llm calls`;
    toggle.classList.add("open");
  }
}

startLiveStream();

// ============================================================
// RENDER
// ============================================================

function allDays() {
  const days = [];
  if (liveDay) days.push(liveDay);
  (LOG.days || []).forEach(d => {
    if (!liveDay || d.date !== liveDay.date) days.push(d);
  });
  return days;
}

function render() {
  const days = allDays();

  $("pinnedArea").innerHTML = `
    <div class="chat-item pinned ${view.type === "pinned" ? "active" : ""}" id="pinnedChat">
      <span class="icon">📌</span>
      <span class="label">search x</span>
      <span class="count">${days.length}</span>
    </div>
  `;
  setTimeout(() => {
    const el = $("pinnedChat");
    if (el) el.onclick = () => { view = { type: "pinned" }; render(); };
  }, 0);

  const list = $("chatList");
  if (!days.length) {
    list.innerHTML = '<div class="sidebar-empty">no chats yet</div>';
  } else {
    list.innerHTML = "";
    days.forEach(d => {
      const findings = d.findings || [];
      const cls = [];
      if (view.type === "day" && view.date === d.date) cls.push("active");
      if (d.live) cls.push("live");
      const item = document.createElement("div");
      item.className = "chat-item " + cls.join(" ");
      const icon = d.live ? "🟢" : "💬";
      const countTxt = d.live
        ? `${d.work_log.length}`
        : (findings.length ? `${findings.length}` : "·");
      item.innerHTML = `
        <span class="icon">${icon}</span>
        <span class="label">${esc(formatDate(d.date))}</span>
        <span class="count">${countTxt}</span>
      `;
      item.onclick = () => { view = { type: "day", date: d.date }; render(); };
      list.appendChild(item);
    });
  }

  if (view.type === "pinned") {
    $("mainHeader").innerHTML = `
      <span class="main-title">search x</span>
      <span class="badge pin-badge">pinned</span>
      <span class="badge">${days.length} days</span>
    `;
    renderSearchX(days);
  } else {
    const day = days.find(d => d.date === view.date);
    if (!day) { view = { type: "pinned" }; render(); return; }
    const liveBadge = day.live ? '<span class="badge live-badge">live</span>' : "";
    const findings = day.findings || [];
    const findingsBadge = findings.length
      ? `<span class="badge">${findings.length} findings</span>`
      : `<span class="badge">no changes</span>`;
    $("mainHeader").innerHTML = `
      <span class="main-title">${esc(formatDate(day.date))}</span>
      ${liveBadge}
      ${findingsBadge}
    `;
    renderDay(day);
  }
}

function renderSearchX(days) {
  if (!days.length) {
    $("mainContent").innerHTML = `
      <div class="empty">
        no chats yet<br><br>
        the agent will create one chat per day,<br>
        even on quiet days
      </div>`;
    return;
  }

  const rows = days.map(d => {
    const findings = d.findings || [];
    let summary;
    let cls = "";
    if (d.live) {
      summary = `streaming · ${d.work_log.length} events so far`;
      cls = "live";
    } else if (findings.length) {
      summary = summarizeFindings(findings);
    } else {
      summary = `<span class="quiet">— no main findings —</span>`;
      cls = "quiet";
    }
    return `
      <tr data-date="${esc(d.date)}">
        <td class="date">${esc(formatDate(d.date))}</td>
        <td class="summary ${cls}">${summary}</td>
        <td class="num">${d.searches || 0}</td>
      </tr>
    `;
  }).join("");

  $("mainContent").innerHTML = `
    <table class="table">
      <thead>
        <tr>
          <th>date</th>
          <th>main findings</th>
          <th class="num">searches</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  document.querySelectorAll("tr[data-date]").forEach(tr => {
    tr.onclick = () => { view = { type: "day", date: tr.getAttribute("data-date") }; render(); };
  });
}

function summarizeFindings(findings) {
  const changes = findings.filter(f => f.type === "change").length;
  const news = findings.filter(f => f.type === "new").length;
  const parts = [];
  if (changes) parts.push(`${changes} change${changes > 1 ? "s" : ""}`);
  if (news) parts.push(`${news} new app${news > 1 ? "s" : ""}`);
  return esc(parts.join(", "));
}

function renderDay(day) {
  const wl = day.work_log || [];
  const searches = wl.filter(x => x.kind === "search").length;
  const llms = wl.filter(x => x.kind === "llm").length;
  const findings = day.findings || [];
  const apps = day.apps || [];

  const wlLabel = day.live ? "live" : "work log";
  const toggleCls = day.live ? "worklog-toggle live open" : "worklog-toggle";

  let bodyHtml = "";

  if (findings.length) {
    bodyHtml += `
      <div class="section-label">main findings</div>
      <div class="findings">
        ${findings.map((f, i) => renderFinding(f, i, "finding")).join("")}
      </div>
    `;
  } else if (day.live) {
    bodyHtml += `
      <div class="section-label">main findings</div>
      <div class="no-findings">working… results will appear when the run finishes</div>
    `;
  } else {
    bodyHtml += `
      <div class="section-label">main findings</div>
      <div class="no-findings">no changes detected · no new apps this run</div>
    `;
  }

  // On quiet days, show all apps that were checked
  if (!findings.length && apps.length) {
    bodyHtml += `
      <div class="section-label">all apps checked (${apps.length})</div>
      <div class="findings">
        ${apps.map((a, i) => renderFinding(a, i + 500, "app")).join("")}
      </div>
    `;
  }

  $("mainContent").innerHTML = `
    <div class="${toggleCls}" id="wlToggle">
      <span class="arrow">${day.live ? "▼" : "▶"}</span>
      ${wlLabel} · ${searches} searches · ${llms} llm calls
    </div>
    <div class="worklog-body ${day.live ? "open" : ""}" id="wlBody">
      ${wl.map(renderLogLine).join("") || '<div style="color: var(--text-dimmer);">waiting for events…</div>'}
    </div>
    ${bodyHtml}
  `;

  const toggle = $("wlToggle");
  const body = $("wlBody");
  if (toggle && body && !day.live) {
    toggle.onclick = () => {
      toggle.classList.toggle("open");
      body.classList.toggle("open");
    };
  }
  if (day.live && body) body.scrollTop = body.scrollHeight;

  document.querySelectorAll(".finding[data-details]").forEach(card => {
    card.onclick = (e) => {
      if (e.target.tagName === "A") return;
      const id = card.getAttribute("data-details");
      const details = document.getElementById(id);
      const hint = card.querySelector(".expand-hint");
      if (!details) return;
      const open = details.style.display === "block";
      details.style.display = open ? "none" : "block";
      card.classList.toggle("expanded", !open);
      if (hint) hint.textContent = open ? "click to expand →" : "click to collapse ↑";
    };
  });
}

function renderLogLine(l) {
  if (l.kind === "search") {
    const status = l.error
      ? `<span class="status-bad">✗ ${esc(l.error)}</span>`
      : `<span class="status-ok">${l.hits} hits</span>`;
    const q = l.query ? l.query.replace(/ 2026$/, "") : "";
    return `<div class="worklog-line"><span class="kind search">search</span><span class="body">${esc(l.provider || "?")} · ${esc(q)} · ${status}</span></div>`;
  }
  if (l.kind === "llm") {
    const status = l.status === "ok"
      ? `<span class="status-ok">ok</span>`
      : `<span class="status-bad">${esc(l.status || "fail")}</span>`;
    return `<div class="worklog-line"><span class="kind llm">llm</span><span class="body">${esc(l.app || "?")} · ${esc(l.model || "?")} · ${status}</span></div>`;
  }
  if (l.kind === "info") {
    return `<div class="worklog-line"><span class="kind info">info</span><span class="body">${esc(l.message || "")}</span></div>`;
  }
  return "";
}

function renderFinding(f, idx, mode) {
  mode = mode || "finding";
  const isNew = f.type === "new";
  const isChange = f.type === "change";

  let icon, cls, heading, summaryLine;
  if (mode === "app") {
    icon = "📄";
    cls = "app";
    heading = f.app_name || f.app || "?";
    const ft = f.free_tier || {};
    const ftText = ft.available ? `free tier: ${ft.credits || "yes"}` : "no free tier";
    summaryLine = `${f.category || "app"} · ${ftText}`;
  } else {
    icon = isNew ? "🆕" : isChange ? "🔄" : "📄";
    cls = isNew ? "new" : isChange ? "change" : "app";
    heading = f.app || f.app_name || "?";
    summaryLine = f.summary || "";
  }

  const meta = f.extracted_by ? `via ${f.extracted_by}` : "";

  const ft = f.free_tier || {};
  const pp = f.paid_pricing || {};
  const features = f.key_features || [];
  const formats = f.output_formats || [];
  const channels = (f.support || {}).channels || [];
  const conf = f.confidence != null ? Math.round(f.confidence * 100) + "%" : "—";
  const website = f.website || null;
  const sourceUrl = f.url || f.source_url || null;

  const detailsId = "fd-" + idx;

  return `
    <div class="finding ${cls}" data-details="${detailsId}">
      <div class="icon">${icon}</div>
      <div class="content">
        <div class="app">${esc(heading)}</div>
        <div class="summary">${esc(summaryLine)}</div>
        ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
        <div class="expand-hint">click to expand →</div>

        <div class="finding-details" id="${detailsId}" style="display:none;">
          <div class="section">basic</div>
          <div class="grid">
            <div class="key">category</div>
            <div class="val">${esc(f.category || "—")}</div>
            <div class="key">vendor</div>
            <div class="val">${esc(f.vendor || "—")}</div>
            <div class="key">website</div>
            <div class="val">${website ? `<a href="${esc(website)}" target="_blank">${esc(website)}</a>` : "—"}</div>
            <div class="key">source</div>
            <div class="val">${sourceUrl ? `<a href="${esc(sourceUrl)}" target="_blank">${esc(sourceUrl)}</a>` : "—"}</div>
          </div>

          <div class="section">free tier</div>
          <div class="grid">
            <div class="key">available</div>
            <div class="val">${ft.available ? '<span class="badge-green">yes</span>' : '<span class="badge-red">no</span>'}</div>
            <div class="key">credits</div>
            <div class="val">${esc(ft.credits || "—")}</div>
            <div class="key">limits</div>
            <div class="val">${esc(ft.limits || "—")}</div>
          </div>

          <div class="section">paid pricing</div>
          <div class="grid">
            <div class="key">cheapest</div>
            <div class="val">${esc(pp.cheapest_plan || "—")}</div>
            <div class="key">notes</div>
            <div class="val">${esc(pp.notes || "—")}</div>
          </div>

          <div class="section">capabilities &amp; features</div>
          <div class="val">${features.length ? `<div class="tags">${features.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : "—"}</div>

          <div class="section">output formats</div>
          <div class="val">${formats.length ? `<div class="tags">${formats.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : "—"}</div>

          <div class="section">support channels</div>
          <div class="val">${channels.length ? `<div class="tags">${channels.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : "—"}</div>

          ${f.quality_notes ? `
            <div class="section">quality notes</div>
            <div class="val">${esc(f.quality_notes)}</div>
          ` : ""}

          <div class="section">confidence</div>
          <div class="val">${conf}</div>
        </div>
      </div>
    </div>
  `;
}

function formatDate(iso) {
  if (!iso) return "unknown";
  try {
    const d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  } catch { return iso; }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

$("runBtn").onclick = async () => {
  if (!config.repo || !config.token) { setStatus("need repo + token", "err"); return; }
  setStatus("triggering…", "busy");
  try {
    const [owner, repo] = config.repo.split("/");
    const res = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/actions/workflows/agent.yml/dispatches`,
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${config.token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ ref: "main" }),
      }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setStatus("triggered · watch live above", "ok");
  } catch (e) {
    setStatus(`run failed: ${e.message}`, "err");
  }
};

load();
</script>
</body>
</html>
