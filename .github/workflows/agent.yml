name: DocGen Agent

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ORCA_API_KEY:      ${{ secrets.ORCA_API_KEY }}
          AIHUBMIX_API_KEY:  ${{ secrets.AIHUBMIX_API_KEY }}
          EXA_API_KEY:       ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
        run: python agent.py

      - name: Commit results back to repo
        run: |
          git config user.name  "docgen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results.json history.json search_usage.json || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Run: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### DocGen Agent run complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f results.json ]; then
            echo "**Apps tracked:** $(python -c "import json;print(len(json.load(open('results.json')).get('apps',[])))")" >> $GITHUB_STEP_SUMMARY
          else
            echo "No results.json produced this run." >> $GITHUB_STEP_SUMMARY
          fi
