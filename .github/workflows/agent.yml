name: DocGen Agent

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch or research"
        required: false
        default: "watch"
        type: choice
        options:
          - watch
          - research
      sector:
        description: "what market to scan (research mode only)"
        required: false
        default: "AI document generation tools"
        type: string
      fields:
        description: "comma-separated fields to extract per item (research mode only)"
        required: false
        default: "description, url, category"
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          AGENT_MODE:         ${{ github.event.inputs.mode || 'watch' }}
          RESEARCH_SECTOR:    ${{ github.event.inputs.sector || 'AI document generation tools' }}
          RESEARCH_FIELDS:    ${{ github.event.inputs.fields || 'description, url, category' }}
          NVIDIA_API_KEY:     ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          ORCA_API_KEY:       ${{ secrets.ORCA_API_KEY }}
          AIHUBMIX_API_KEY:   ${{ secrets.AIHUBMIX_API_KEY }}
          EXA_API_KEY:        ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY:  ${{ secrets.FIRECRAWL_API_KEY }}
        run: python agent.py

      - name: Commit results
        run: |
          git config user.name  "docgen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add log.json baseline.json search_usage.json results.json || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Run (${{ github.event.inputs.mode || 'watch' }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
